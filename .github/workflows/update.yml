name: עדכון מחירים ופרסום האתר

on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "config.json", "collector/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r collector/requirements.txt
      - name: Collect prices from transparency files
        env:
          ISRAEL_PROXY: ${{ secrets.ISRAEL_PROXY }}
          PREV_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python collector/collect.py
      - name: Test basket on real data (Ganei Tikva)
        continue-on-error: true
        run: node collector/test_basket.mjs _site
      - name: Save geocoding cache
        run: |
          if ! git diff --quiet cache/; then
            git config user.name "price-bot"
            git config user.email "price-bot@users.noreply.github.com"
            git add cache/
            git commit -m "update geocode cache [skip ci]"
            git push || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
